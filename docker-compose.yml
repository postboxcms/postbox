services:
    app:
        build:
            context: ./vendor/postboxcms/desk/runtimes/php/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: desk-8.5/app
        container_name: postbox-app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8080}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            POSTBOXCMS_DESK: 1
            XDEBUG_MODE: '${DESK_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${DESK_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - desk
        depends_on:
            - mysql
            - redis
        deploy:
            resources:
                limits:
                    cpus: '${DESK_APP_CPU_LIMIT:-1.0}'
                    memory: '${DESK_APP_MEMORY_LIMIT:-512M}'
    web:
        build:
            context: ./vendor/postboxcms/desk/runtimes/node/20
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: desk-20/web
        container_name: postbox-web
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${WEB_PORT:-5172}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            NODE_ENV: '${NODE_ENV:-development}'
            SSR_PORT: '80'
            SSR_HOST: 0.0.0.0
        volumes:
            - '.:/var/www/html'
        networks:
            - desk
        depends_on:
            - app
        deploy:
            resources:
                limits:
                    cpus: '${DESK_WEB_CPU_LIMIT:-1.0}'
                    memory: '${DESK_WEB_MEMORY_LIMIT:-512M}'
    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: postbox-db
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'desk-mysql:/var/lib/mysql'
            - './vendor/postboxcms/desk/database/mysql/create-postbox-database.sh:/docker-entrypoint-initdb.d/10-create-postbox-database.sh'
        networks:
            - desk
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
        deploy:
            resources:
                limits:
                    cpus: '${DESK_DB_CPU_LIMIT:-1.0}'
                    memory: '${DESK_DB_MEMORY_LIMIT:-512M}'
    redis:
        image: 'redis:alpine'
        container_name: postbox-cache
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        networks:
            - desk
        deploy:
            resources:
                limits:
                    cpus: '${DESK_REDIS_CPU_LIMIT:-0.5}'
                    memory: '${DESK_REDIS_MEMORY_LIMIT:-256M}'
networks:
    desk:
        driver: bridge
        name: postbox-network
volumes:
    desk-mysql:
        driver: local
        name: DeskStorage
    desk-redis:
        driver: local
        name: DeskStorage
